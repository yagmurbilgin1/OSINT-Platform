<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arama Geçmişi - OSINT Platform</title>

    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

<div class="container">

    <h1>🕘 Arama Geçmişi</h1>

    <p>OSINT Platform üzerinde yaptığınız aramalar aşağıda listelenmektedir.</p>

    {% if searches %}

    <table>

        <thead>

            <tr>

                <th>Kelime</th>

                <th>Tarih</th>

            </tr>

        </thead>

        <tbody>

            {% for row in searches %}

            <tr>

                <td>{{ row[0] }}</td>

                <td>{{ row[1] }}</td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

    {% else %}

    <p>
        Henüz herhangi bir arama yapılmamış.
    </p>

    {% endif %}

    <br>

    <a class="history-button" href="/">
        ← Yeni Arama
    </a>

    <br><br>

    <a class="history-button" href="/dashboard">
        📊 Dashboard
    </a>

    <br><br>

    <a class="history-button" href="/download-csv">
        📥 CSV İndir
    </a>

    &nbsp;&nbsp;

    <a class="history-button" href="/download-pdf">
        📄 PDF İndir
    </a>

</div>

</body>

</html>
